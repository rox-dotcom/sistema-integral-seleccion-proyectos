<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Inicio de Sesión</title>
    <script type="module" src="src/login.js"></script>
    <link rel="stylesheet" href="src/styles/styles_login.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="user-act-section">
            <h1 class="title">Iniciar Sesión</h1>
            <div class="fields">
                <input id="login-user-name" type="text" placeholder="Usuario" class="input-text" required>
            </div>

            <div class="fields">
                <input id="password-user" type="password" placeholder="Contraseña"class="input-text" required>
                <button id="view-passw" class="show-pass"><i class="fa fa-eye"> </i> </button>
                
            </div>

            <button class="button" id="login">Iniciar Sesión</button>
            <div>
                <p>¿No tienes cuenta?</p>
            </div> 
            <button class="button" id="signin">Registrarse</button>
        </div>   
          
    </div>
    <div class="anonimoB">
        <button id="anonym-user" class="button" >Usuario anonimo</button>
    </div>
</body>
</html>
