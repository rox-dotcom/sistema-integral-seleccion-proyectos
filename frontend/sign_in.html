<!DOCTYPE html>
<html>
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Registro</title>
    <link rel="stylesheet" href="src/styles/styles_login.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <script src='src/modules/signin.js'></script>
    
</head>

<body>
    <div class="container">
        <div class="user-act-section">
            <h1 class="title">Crear Usuario</h1>
            <div class="fields">
                <input id="create-user-name" type="text" placeholder="Usuario" class="input-text" required>
            </div>

            <div class="fields">
                <input id="new-password-user" type="password" placeholder="Contraseña" class="input-text" required>
                <i class="fa-solid fa-eye show-pass"></i>    
            </div>

            <button class="button" id="create-user"> Crear Usuario</button>
            
            <div>
                <p>¿Ya tienes cuenta?</p>
            </div> 
            <button class="button" id="signin">Inicia sesión</button>
        </div>
    </div>
</body>
</html>
